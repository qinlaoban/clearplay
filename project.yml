name: ClearPlay
options:
  bundleIdPrefix: com.clearplay
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

packages:
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine.git
    exactVersion: 6.39.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: YES

targets:
  ClearPlay-iOS:
    type: application
    platform: iOS
    sources:
      - ClearPlay
    dependencies:
      - package: AetherEngine
    # 启用 iCloud 续播同步（需在 Xcode 配置签名 Team 后取消注释）：
    # entitlements:
    #   path: Support/ClearPlay.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearplay.app.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES

  ClearPlay-macOS:
    type: application
    platform: macOS
    sources:
      - ClearPlay
    dependencies:
      - package: AetherEngine
    # 启用 iCloud 续播同步（需在 Xcode 配置签名 Team 后取消注释）：
    # entitlements:
    #   path: Support/ClearPlay.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearplay.app.mac
        ENABLE_HARDENED_RUNTIME: YES

  ClearPlayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ClearPlayTests
    dependencies:
      - target: ClearPlay-macOS
      - package: AetherEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearplay.tests

schemes:
  ClearPlay-macOS:
    build:
      targets:
        ClearPlay-macOS: all
    run:
      config: Debug

  ClearPlay-iOS:
    build:
      targets:
        ClearPlay-iOS: all
    run:
      config: Debug

  ClearPlayTests:
    build:
      targets:
        ClearPlay-macOS: all
        ClearPlayTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ClearPlayTests
