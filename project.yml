name: ClearPlay
options:
  bundleIdPrefix: com.clearplay
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

packages:
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine.git
    exactVersion: 6.39.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: YES

targets:
  ClearPlay-iOS:
    type: application
    platform: iOS
    sources:
      - ClearPlay
    dependencies:
      - package: AetherEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearplay.app.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES

  ClearPlay-macOS:
    type: application
    platform: macOS
    sources:
      - ClearPlay
    dependencies:
      - package: AetherEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clearplay.app.mac
        ENABLE_HARDENED_RUNTIME: YES
